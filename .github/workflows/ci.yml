name: ci

# Every branch push, every pull request, and — through `workflow_call` — the
# release workflow. One definition of the checks, so a release cannot skip
# something a push would have caught.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: format
        run: nix develop --command cargo fmt --check

      - name: clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: test
        run: nix develop --command cargo test
